{{- /* Both icons ship; CSS shows whichever the current theme is not, so the
       button pictures where pressing it goes rather than where you are. */ -}}
<button type="button" class="theme-toggle" aria-pressed="false" title="Switch to dark" aria-label="Switch to dark theme">
    <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
    <span class="theme-icon theme-icon-light" aria-hidden="true">☀</span>
</button>
