name: Publish

# Tagging already publishes the theme: proxy.golang.org serves it the moment a
# tag exists, and `hugo mod get` finds it without anything here running. What is
# missing is the human half — release notes for whoever is deciding whether to
# bump. Bumping the pin on a consuming site stays a manual step there.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  verify_tag:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag is on main
        env:
          SHA: ${{ github.sha }}
          TAG: ${{ github.ref_name }}
        run: |
          git fetch origin main
          if ! git branch -r --contains "$SHA" | grep -E -q '(^|\s)origin/main$'; then
            echo "Error: tag $TAG is not on the main branch."
            exit 1
          fi

  release:
    name: Release
    needs: [verify_tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Keep a Changelog puts a version's entries between its heading and the
      # next one. Blank lines around them are formatting, not content: the ones
      # before the first entry and after the last are dropped, the ones between
      # entries are kept.
      - name: Take the notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          awk -v want="## [$VERSION]" '
            index($0, want) == 1 { found = 1; next }
            found && /^## \[/    { exit }
            found {
              if (NF == 0) { blanks++; next }
              if (started) { for (i = 0; i < blanks; i++) print "" }
              blanks = 0
              started = 1
              print
            }
          ' CHANGELOG.md > notes.md

          # Loudly, not quietly. Generating notes from commit subjects instead
          # would publish a release nobody wrote and hide the omission.
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Open one before tagging $TAG."
            exit 1
          fi

          echo "Notes for $TAG:"
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --title "$TAG" --notes-file notes.md
